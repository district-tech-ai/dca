# Build the TanStack Start app and deploy it to Azure App Service (Linux, Node 22).

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  # Name of the Azure Resource Manager service connection (Project settings → Service connections)
  azureServiceConnection: '<service-connection-name>'
  # Name of the App Service
  webAppName: '<app-name>'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Install Node.js'

- script: |
    npm ci
    npm run build
  displayName: 'npm ci and build'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '.output'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
  displayName: 'Zip build output'

- task: AzureWebApp@1
  inputs:
    azureSubscription: '$(azureServiceConnection)'
    appType: webAppLinux
    appName: '$(webAppName)'
    package: '$(Build.ArtifactStagingDirectory)/app.zip'
    runtimeStack: 'NODE|22-lts'
    startUpCommand: 'node server/index.mjs'
  displayName: 'Deploy to Azure App Service'
